on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'doc/**'
  push:
    paths-ignore:
      - 'README.md'
      - 'doc/**'

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: false

      - run: go mod download

      - name: Run unit and integration tests
        run: |
          go test -race -count=1 ./...

      - name: Run linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
