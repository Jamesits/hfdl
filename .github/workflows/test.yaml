on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'doc/**'
  push:
    paths-ignore:
      - 'README.md'
      - 'doc/**'

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: false

      - run: go mod download

      - name: Run unit and integration tests
        run: |
          go test -race -count=1 ./...

      - name: go vet
        # Build-tagged platform code (pkg/fcio, pkg/sched, pkg/store, pkg/cache,
        # cmd) must compile cleanly on every GOOS/GOARCH we ship. This job
        # already runs natively on linux, darwin and windows, so we reuse each
        # runner's native GOOS (via `go env GOOS`) and only iterate over GOARCH.
        # The three OS runners together cover the full matrix AGENTS.md requires,
        # including combos with no native runner (e.g. linux/arm64,
        # darwin/amd64, windows/arm64). We do not stop at the first failure:
        # every arch runs and failures are reported together at the end.
        shell: bash
        run: |
          goos="$(go env GOOS)"
          failed=""
          for goarch in amd64 arm64; do
            echo "::group::go vet ${goos}/${goarch}"
            if ! GOOS="${goos}" GOARCH="${goarch}" go vet ./...; then
              failed="${failed} ${goos}/${goarch}"
            fi
            echo "::endgroup::"
          done
          if [ -n "${failed}" ]; then
            echo "go vet failed for:${failed}"
            exit 1
          fi

      - name: Run linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
